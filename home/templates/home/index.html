{% extends 'base.html'%}

{% block content %}
<h2>Home page</h2>
<div class="mb-4">
    <a class="btn btn-outline-primary px-4" href="{% url 'home:home' %}">all</a>
    {% for category in categories %}
    <div class="btn-group">
        <a href="{{ category.get_absolute_url }}" class="btn btn-outline-primary">{{category.name}}</a>
        <button type="button" class="btn btn-primary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown"
                aria-expanded="false">
            <span class="visually-hidden">Toggle Dropdown</span>
        </button>
        <ul class="dropdown-menu">
            {% for sub in category.scategory.all %}
            <li><a class="dropdown-item" href="{{ sub.get_absolute_url }}">{{sub.name}}</a></li>
            {% endfor %}
        </ul>
    </div>
    {% endfor %}
</div>
<div class="row">
    {% for product in products %}
    <div class="card col-md-3">
        <div class="card-body">
            <img src="{{product.image.url}}" alt="{{product.name}}" class="card-img-top mb-3">
            <a class="card-title " href="{{ product.get_absolute_url }}">{{product.name}}</a>

        </div>
    </div>
    {% endfor %}
</div>
{% endblock content %}
