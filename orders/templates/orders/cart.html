{% extends 'base.html'%}

{% block content %}
<table class="table">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Count</th>
      <th scope="col">Unit Price</th>
      <th scope="col">Total Price</th>
      <th scope="col">Remove</th>
    </tr>
  </thead>
  <tbody>
  {% for item in cart %}
    <tr>
      <th>{{ forloop.counter }}</th>
      <td>{{ item.product }}</td>
      <td>{{ item.quantity }}</td>
      <td>{{ item.price }}</td>
      <td>{{ item.total_price }}</td>
      <td><a href="{% url 'orders:cart_remove' item.product.id %}" role="button" class="btn btn-outline-danger"><i class="fa fa-trash" style="font-size:20px"></i></a></td>
    </tr>
{% endfor %}
  <tr>
    <td colspan="5 "><strong>Total</strong></td>
    <td><strong>{{cart.get_total_price}}</strong></td>
  </tr>
  </tbody>
</table>

<a href="{% url 'orders:order_create' %}" class="btn btn-primary">Checkout</a>
{% endblock content %}
