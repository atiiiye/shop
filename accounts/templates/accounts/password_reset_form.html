{% extends 'base.html'%}

{% block content%}
<form method="post" action="" novalidate class="d-flex flex-column align-items-center py-5">
    {% csrf_token %}
    <div class="row col-6 align-items-center justify-content-center">
        <div class="mb-2 d-flex flex-column">
            {{ form.email.label }}
            {{ form.email }}

            {% for error in form.email.errors %}
            <p class="text-danger">{{ error }}</p>
            {% endfor %}
        </div>

        <button class="btn btn-primary col-md-4 py-2 mt-3" type="submit">Reset</button>
    </div>
</form>

{% endblock content%}
