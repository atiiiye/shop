{% extends 'base.html'%}

{% block content%}

{% if validlink %}
<form method="post" action="" novalidate class="d-flex flex-column align-items-center py-5">
    {% csrf_token %}
    <div class="row col-6 align-items-center justify-content-center">
        {{form}}

        <button class="btn btn-primary col-md-4 py-2 mt-3" type="submit">Change</button>
    </div>
</form>

{% else %}
    <span>Please try again</span>
{% endif %}

{% endblock content%}
