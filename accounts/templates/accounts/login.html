{% extends 'base.html'%}

{% block content%}
<h2>Login form</h2>
<form method="post" action="" novalidate class="d-flex flex-column align-items-center py-5">
    {% csrf_token %}
    <div class="row col-6 align-items-center justify-content-center">
        <div class="mb-2">
            {{form.phone_number.label}}
            {{ form.phone_number }}

            {% for error in form.phone_number.errors %}
            <p class="text-danger">{{ error }}</p>
            {% endfor %}
        </div>

        <button class="btn btn-primary col-md-4 py-2 mt-3" type="submit">Login</button>
    </div>
</form>
{% endblock content%}
